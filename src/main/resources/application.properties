spring.application.name=booking-system

# ---- Database (MySQL by default) ----
# Switch to PostgreSQL by setting spring.profiles.active=postgres
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:booking_system}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- JWT ----
jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-key-of-at-least-32-bytes}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ---- Swagger / OpenAPI ----
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs

# ---- Misc ----
server.error.include-message=always
